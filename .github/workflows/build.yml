name: Build Windows Exe

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger manually from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install GTK3 via MSYS2 (pre-installed on runner)
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-pango mingw-w64-x86_64-gdk-pixbuf2"
          echo "C:\msys64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Build exe
        shell: python
        run: |
          import subprocess, glob, os

          gtk_bin = r"C:\msys64\mingw64\bin"

          # DLL prefixes covering WeasyPrint's full native dependency chain
          prefixes = [
              "libgobject-", "libcairo", "libpango", "libgdk_pixbuf",
              "libffi-", "libgio-", "libglib-", "libgmodule-",
              "libfontconfig", "libfreetype", "libharfbuzz",
              "libintl", "libpng", "zlib1", "libfribidi",
              "libpcre2", "libbrotli", "libexpat", "libbz2",
              "libgraphite2", "libstdc++", "libwinpthread", "libgcc_s",
              "libiconv", "libpixman",
          ]

          dll_args = []
          for prefix in prefixes:
              for dll in glob.glob(os.path.join(gtk_bin, f"{prefix}*.dll")):
                  dll_args.extend(["--add-binary", f"{dll};."])

          print(f"Bundling {len(dll_args)//2} GTK DLLs:")
          for i in range(0, len(dll_args), 2):
              print(f"  {os.path.basename(dll_args[i+1].split(';')[0])}")

          cmd = [
              "pyinstaller", "--onefile", "--windowed",
              "--icon=frontend/public/icon.ico",
              "--name="Invoice Builder"",
              "--add-data", "dist;dist",
              "--add-data", "app\\templates;app\\templates",
              "--add-data", "app\\fonts.conf;app",
              *dll_args,
              "--collect-all", "weasyprint",
              "--collect-all", "cairocffi",
              "--collect-all", "tinycss2",
              "app/main.py",
          ]

          subprocess.run(cmd, check=True)

      - name: Verify exe starts
        run: |
          $proc = Start-Process -FilePath "dist\Invoice Builder.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "Exe crashed on startup (exit code $($proc.ExitCode))"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Exe started successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceBuilder-windows
          path: "dist/Invoice Builder.exe"
          retention-days: 30
