name: Build Windows Exe

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger manually from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed `
            --icon=frontend/public/icon.ico `
            --name=LisaInvoice `
            --add-data "frontend/dist;dist" `
            --collect-all weasyprint `
            --collect-all cairocffi `
            --collect-all tinycss2 `
            app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LisaInvoice-windows
          path: dist/LisaInvoice.exe
          retention-days: 30
